# https://taskfile.dev

version: '3'

env:
  PACKAGE: clcoevt

tasks:
  default:
    cmds:
      - task: info
      - task: list
    silent: true

  info:
    cmds:
      - 'echo Task {{.TASK_VERSION}}'
      - 'echo Taskfile: {{.TASKFILE}}'
    silent: true

  list:
    cmds:
      - 'task -l -t {{.TASKFILE}}'
    silent: true

  taskfile-path:
    cmds:
      - 'echo {{.TASKFILE}}'
    silent: true

  lint:
    desc: run linter
    cmds:
      - uv run ruff check

  lint-fix:
    desc: run linter and fix issues
    cmds:
      - uv run ruff check --fix

  typecheck:
    desc: run type checker
    cmds:
      - uv run ty check
    aliases: [ ty ]

  format:
    desc: run formatter
    cmds:
      - uv run ruff format

  build:
    desc: build the package
    cmds:
      - uv build --clear

  test:
    desc: run tests on the src
    env:
      UV_VENV_CLEAR: 1
    cmds:
      - uv run nox

  test-package:
    desc: run tests on the installed package
    env:
        UV_VENV_CLEAR: 1
    cmds:
      - uv run nox -f noxfile-package.py

  update-project:
    desc: Update this project
    cmds:
      - uv sync

  update-patch-version:
    desc: update the patch version of this project
    vars:
      NEWVERSION:
        sh: uv version --bump patch --dry-run
    prompt:
      - "{{.NEWVERSION}}\n  Are you sure?"
    cmds:
      - uv version --bump patch

  update-minor-version:
    desc: update the minor version of this project
    vars:
      NEWVERSION:
        sh: uv version --bump minor --dry-run
    prompt:
      - "{{.NEWVERSION}}\n  Are you sure?"
    cmds:
      - uv version --bump minor

  update-major-version:
    desc: update the major version of this project
    vars:
      NEWVERSION:
        sh: uv version --bump major --dry-run
    prompt:
      - "{{.NEWVERSION}}\n  Are you sure?"
    cmds:
      - uv version --bump major
